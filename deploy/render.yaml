services:
  - type: web
    name: surebet-pro
    env: python
    buildCommand: pip install flask gunicorn
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --keep-alive 5
    healthCheckPath: /api/ping
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
